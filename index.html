<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gxAgent Studio</title>
    <script>
      // Apply the last-known theme before first paint so dark themes don't
      // flash a white frame while the async Rust config loads (which then
      // re-applies the authoritative value).
      (function () {
        try {
          var raw = localStorage.getItem("gx_theme") || "light";
          var normalized = raw === "system"
            ? "system"
            : (raw === "dark" || raw === "ember" || raw === "grape" || raw === "amber")
              ? "dark"
              : "light";
          var mode = normalized === "system"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : normalized;
          document.documentElement.setAttribute("data-theme", mode);
          document.documentElement.setAttribute("data-mode", mode);
          document.documentElement.style.backgroundColor = mode === "dark" ? "#111215" : "#f6f7f9";
        } catch (e) { /* first run: defaults are fine */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
